name: Unstable Linux build
on:
  push:
    branches: [unstable]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    if: github.ref == 'refs/heads/unstable'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config qt6-base-dev qt6-declarative-dev libqt6sql6-sqlite libmpv-dev qt6-wayland qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qtquick-templates qml6-module-qttest libgl1-mesa-dri libegl1 curl file patchelf desktop-file-utils
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build --parallel 2
      - name: Tests and application startup
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          ctest --test-dir build --output-on-failure
          XDG_DATA_HOME="$RUNNER_TEMP/veluno-smoke" timeout 20s ./build/veluno --smoke-test
      - name: Package and verify AppImage
        run: packaging/appimage.sh build build/package
      - name: Upload unstable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VELUNO-unstable-${{ github.sha }}
          path: |
            build/package/*.AppImage
            build/package/*.sha256
          if-no-files-found: error
          retention-days: 14
